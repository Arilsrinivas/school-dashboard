services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: educonnect
      POSTGRES_USER: educonnect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      EDUCONNECT_APP_PASSWORD: ${EDUCONNECT_APP_PASSWORD:?Set EDUCONNECT_APP_PASSWORD in .env}
      EDUCONNECT_PLATFORM_PASSWORD: ${EDUCONNECT_PLATFORM_PASSWORD:?Set EDUCONNECT_PLATFORM_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes:
      - "educonnect-db:/var/lib/postgresql/data"
      - "./infra/postgres-init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educonnect -d educonnect"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  educonnect-db:
